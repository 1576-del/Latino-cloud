name: Compilar extensiones
on:
  push:
    branches: [main, experimental/peelink2-http3-aislado]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudstream-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas y compilación
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :Peelink2:testDebugUnitTest :Peelink2:make :Peelink2:ensureJarCompatibility \
            :Peelink2HTTP3Experimental:testDebugUnitTest \
            :Peelink2HTTP3Experimental:make :Peelink2HTTP3Experimental:ensureJarCompatibility \
            makePluginsJson
      - name: Verificar identidad separada
        run: |
          test "$(jq 'length' build/plugins.json)" = 2
          test "$(jq '[.[] | select(.internalName == "Peelink2")] | length' build/plugins.json)" = 1
          test "$(jq '[.[] | select(.internalName == "Peelink2HTTP3Experimental")] | length' build/plugins.json)" = 1
          jq -e '.[] | select(.internalName == "Peelink2HTTP3Experimental") | ((.name == "Peelink2HTTP3Experimental") and (.description | test("Experimental")) and (.version >= 1))' build/plugins.json > /dev/null
      - name: Preparar paquete experimental
        run: |
          mkdir -p dist/experimental
          cp Peelink2HTTP3Experimental/build/Peelink2HTTP3Experimental.cs3 dist/experimental/
          cp Peelink2HTTP3Experimental/build/Peelink2HTTP3Experimental.jar dist/experimental/
          test -s dist/experimental/Peelink2HTTP3Experimental.cs3
          test -s dist/experimental/Peelink2HTTP3Experimental.jar
          (cd dist/experimental && sha256sum Peelink2HTTP3Experimental.cs3 Peelink2HTTP3Experimental.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: peelink2-http3-experimental
          path: dist/experimental/
          if-no-files-found: error
          retention-days: 90
      - name: Preparar distribución original
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist/original
          cp Peelink2/build/Peelink2.cs3 dist/original/
          cp Peelink2/build/Peelink2.jar dist/original/
          jq '[.[] | select(.internalName == "Peelink2")]' build/plugins.json > dist/original/plugins.json
          cp repo.json dist/original/
          test "$(jq length dist/original/plugins.json)" = 1
          test -s dist/original/Peelink2.cs3
          test -s dist/original/Peelink2.jar
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: cloudstream-latino-original
          path: dist/original/
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publicar distribución original
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cloudstream-latino-original
          path: dist
      - name: Publicar rama builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin builds || true
          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git worktree add publication origin/builds
          else
            git worktree add --detach publication
            git -C publication checkout --orphan builds
            git -C publication rm -rf . || true
          fi
          git -C publication ls-files -z | xargs -0 -r -I '{}' rm -f -- "publication/{}"
          cp dist/* publication/
          git -C publication config user.name "github-actions[bot]"
          git -C publication config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publication add -A
          if git -C publication diff --cached --quiet; then exit 0; fi
          git -C publication commit -m "Compilar ${GITHUB_SHA}"
          git -C publication push origin HEAD:builds
